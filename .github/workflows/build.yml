name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Compilar
        run: |
          mkdir -p lib classes dist res stubsrc/javax/microedition/media/control stubclasses
          python3 make_icon.py
          M=https://repo1.maven.org/maven2/org/microemu
          wget -q $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar -P lib
          wget -q $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar -P lib
          wget -q https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q proguard-7.4.2.zip
          D=stubsrc/javax/microedition/media
          cat > $D/MediaException.java <<'JEOF'
          package javax.microedition.media;
          public class MediaException extends Exception { public MediaException() {} public MediaException(String s) { super(s); } }
          JEOF
          cat > $D/Control.java <<'JEOF'
          package javax.microedition.media;
          public interface Control {}
          JEOF
          cat > $D/Controllable.java <<'JEOF'
          package javax.microedition.media;
          public interface Controllable { Control getControl(String type); }
          JEOF
          cat > $D/Player.java <<'JEOF'
          package javax.microedition.media;
          public interface Player extends Controllable {
            void realize() throws MediaException;
            void prefetch() throws MediaException;
            void start() throws MediaException;
            void stop() throws MediaException;
            void close();
            void setLoopCount(int count);
          }
          JEOF
          cat > $D/Manager.java <<'JEOF'
          package javax.microedition.media;
          public class Manager {
            public static Player createPlayer(java.io.InputStream in, String type) throws java.io.IOException, MediaException { return null; }
          }
          JEOF
          cat > $D/control/VolumeControl.java <<'JEOF'
          package javax.microedition.media.control;
          public interface VolumeControl extends javax.microedition.media.Control { int setLevel(int level); int getLevel(); }
          JEOF
          javac -d stubclasses $(find stubsrc -name '*.java')
          jar cf lib/mmapi-stubs.jar -C stubclasses .
          javac -encoding UTF-8 -source 1.3 -target 1.3 -cp "lib/*" -d classes src/*.java
          jar cfm tmp.jar manifest.txt -C classes . -C res .
          java -jar proguard-7.4.2/lib/proguard.jar @proguard.pro
          S=$(stat -c%s dist/SoulsE72.jar)
          printf "MIDlet-1: Souls E72,/icon.png,Main\nMIDlet-Name: Souls E72\nMIDlet-Vendor: Souls\nMIDlet-Version: 3.0\nMIDlet-Icon: /icon.png\nMIDlet-Jar-URL: SoulsE72.jar\nMIDlet-Jar-Size: $S\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n" > dist/SoulsE72.jad
      - uses: actions/upload-artifact@v4
        with:
          name: SoulsE72
          path: dist
