name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Compilar
        run: |
          mkdir -p lib classes dist res
          python3 make_icon.py
          M=https://repo1.maven.org/maven2/org/microemu
          wget -q $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar -P lib
          wget -q $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar -P lib
          wget -q https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q proguard-7.4.2.zip
          javac -encoding UTF-8 -source 1.3 -target 1.3 -cp "lib/*" -d classes src/*.java
          jar cfm tmp.jar manifest.txt -C classes . -C res .
          java -jar proguard-7.4.2/lib/proguard.jar @proguard.pro
          S=$(stat -c%s dist/SoulsE72.jar)
          printf "MIDlet-1: Souls E72,/icon.png,Main\nMIDlet-Name: Souls E72\nMIDlet-Vendor: Souls\nMIDlet-Version: 2.0\nMIDlet-Icon: /icon.png\nMIDlet-Jar-URL: SoulsE72.jar\nMIDlet-Jar-Size: $S\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n" > dist/SoulsE72.jad
      - uses: actions/upload-artifact@v4
        with:
          name: SoulsE72
          path: dist
